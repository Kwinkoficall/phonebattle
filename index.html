<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>PHONEBATTLE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090a14;--p1:#12142a;--p2:#1a1d3a;--p3:#242850;--tx:#eef0ff;--mu:#8a90b8;--ac:#00d9ff;--ac2:#7b5cff;--gold:#ffc23a;--ok:#3ddc84;--bad:#ff4d5e;--top:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(900px 500px at 50% -10%,#1d2a6a55,transparent 70%),radial-gradient(700px 500px at 100% 100%,#5a1f8a40,transparent 70%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
#hd{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--top)) 14px 8px}
#logo{font-weight:900;letter-spacing:.5px;font-size:19px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#hd .sp{flex:1}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--p2);border:1px solid #ffffff14;font-weight:800;font-size:14px;white-space:nowrap}
.chip.coin{color:var(--gold)}
.chip.lv{color:var(--ac);font-size:12px}
#snd{width:36px;height:36px;border-radius:50%;background:var(--p2);border:1px solid #ffffff14;font-size:16px}
#main{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px 14px 110px;display:none;-webkit-overflow-scrolling:touch}
.scr.on{display:block}
h2{margin:6px 2px 10px;font-size:20px}
.sub{color:var(--mu);font-size:13px;margin:0 2px 12px;line-height:1.4}
#nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:64px;border-radius:24px;display:flex;justify-content:space-around;align-items:center;background:#12142ad9;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff1a;box-shadow:0 10px 30px #0008;z-index:20;max-width:640px;margin:0 auto}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mu);padding:6px 0;position:relative}
#nav button span{font-size:21px;line-height:1}
#nav button.on{color:#fff}
#nav button.on span{filter:drop-shadow(0 0 8px var(--ac))}
#nav i{position:absolute;top:2px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--bad);display:none}
#nav i.on{display:block}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.case{border-radius:20px;padding:12px 10px 12px;background:linear-gradient(160deg,var(--p3),var(--p1));border:1px solid #ffffff17;text-align:center;position:relative;overflow:hidden;transition:transform .15s}
.case:active{transform:scale(.97)}
.case>svg{width:100%;height:120px;display:block}
.case>.cimg{width:100%;height:120px;object-fit:contain;display:block}
.case b{display:block;font-size:15px;margin-top:4px}
.case small{display:block;color:var(--mu);font-size:11.5px;margin:2px 0 8px;min-height:15px}
.price{display:inline-flex;gap:5px;align-items:center;padding:7px 14px;border-radius:999px;background:linear-gradient(90deg,var(--ac),var(--ac2));font-weight:900;font-size:14px;color:#04101c}
.price.free{background:linear-gradient(90deg,var(--ok),#9dff6a)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 12px;border-radius:16px;font-weight:900;font-size:14.5px;white-space:nowrap;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#04101c;border:0}
.btn.g{background:var(--p3);color:var(--tx);border:1px solid #ffffff1a}
.btn.red{background:linear-gradient(90deg,#ff4d5e,#ff8a4d);color:#fff}
.btn.gold{background:linear-gradient(90deg,#ffc23a,#ff9a3a);color:#2a1600}
.btn:disabled,.btn.dis{opacity:.45;pointer-events:none}
.btn.w{width:100%}
.row{display:flex;gap:10px}
.row>*{flex:1}
.panel{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid #ffffff14;border-radius:20px;padding:14px;margin-bottom:12px}
.hero{display:flex;gap:12px;align-items:center}
.hero .t{flex:1}
.hero b{font-size:17px}
.bar{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-weight:700;margin:2px 0 8px;padding:6px 4px}
/* рулетка */
#rl{position:relative;height:178px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#0d0f22,#151833);border:1px solid #ffffff17;margin-bottom:12px}
#rl:before,#rl:after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:3;pointer-events:none}
#rl:before{left:0;background:linear-gradient(90deg,#0d0f22,transparent)}
#rl:after{right:0;background:linear-gradient(270deg,#0d0f22,transparent)}
#mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);z-index:4;box-shadow:0 0 14px var(--gold)}
#mk:before{content:"";position:absolute;top:-1px;left:-7px;border:8.5px solid transparent;border-top-color:var(--gold)}
#strip{position:absolute;left:0;top:10px;display:flex;gap:8px;will-change:transform}
.ri{flex:none;width:118px;height:158px;border-radius:14px;background:linear-gradient(180deg,#1c2044,#12152e);border:1px solid #ffffff12;border-bottom:4px solid var(--rc,#888);text-align:center;padding:6px 4px;font-size:11px;line-height:1.2;overflow:hidden}
.ri svg{height:104px;width:auto;display:block;margin:0 auto 4px}
.ri span{display:block;color:#c9cdef;font-weight:600}
/* карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.pc{position:relative;border-radius:16px;background:linear-gradient(180deg,var(--p3),var(--p1));border:1px solid #ffffff14;border-bottom:4px solid var(--rc,#888);padding:7px 5px 7px;text-align:center;overflow:hidden}
.pc svg{height:96px;width:auto;display:block;margin:0 auto 4px}
.pc .nm{font-size:11.5px;font-weight:800;line-height:1.15;min-height:27px;display:flex;align-items:center;justify-content:center}
.pc .vl{font-size:11px;color:var(--gold);font-weight:800;margin-top:2px}
.pc .cd{font-size:9.5px;color:var(--mu);margin-top:1px}
.pc.sh{box-shadow:0 0 0 1px #fff3,0 0 18px var(--rc);animation:shine 2.4s infinite}
.pc.sh:after{content:"★";position:absolute;top:4px;right:7px;color:#fff;font-size:11px;text-shadow:0 0 6px var(--rc)}
.pc.lock svg{filter:grayscale(1) brightness(.35)}
.pc.lock .nm,.pc.lock .vl{opacity:.5}
.pc.sel{outline:2px solid var(--ac);outline-offset:-2px}
.pc .qty{position:absolute;top:5px;left:6px;background:#000a;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:800}
@keyframes shine{50%{box-shadow:0 0 0 1px #fff5,0 0 28px var(--rc)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fc{flex:none;padding:7px 12px;border-radius:999px;background:var(--p2);border:1px solid #ffffff12;font-size:12.5px;font-weight:700;color:var(--mu)}
.fc.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#04101c;border-color:transparent}
select{background:var(--p2);color:var(--tx);border:1px solid #ffffff1a;border-radius:12px;padding:9px 10px;font:inherit;font-size:13px;font-weight:700}
/* модалка */
#md{position:absolute;inset:0;background:#05060dcc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50}
#md.on{display:flex}
#mdb{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,var(--p2),var(--p1));border-radius:26px 26px 0 0;border:1px solid #ffffff1a;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.big{text-align:center}
.big svg{height:230px;width:auto;margin:6px auto 4px;display:block;filter:drop-shadow(0 12px 22px var(--rc))}
.big .rn{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;color:#06101c;background:var(--rc)}
.big h3{margin:8px 0 2px;font-size:22px}
.big .meta{color:var(--mu);font-size:13px}
.big .val{font-size:26px;font-weight:900;color:var(--gold);margin:6px 0 10px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 14px;text-align:left}
.spec div{background:#ffffff0c;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mu)}
.spec b{display:block;color:var(--tx);font-size:13.5px;margin-top:1px}
.glow{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#toast{position:absolute;left:50%;top:calc(64px + var(--top));transform:translateX(-50%) translateY(-20px);background:#1d2150;border:1px solid #ffffff26;border-radius:14px;padding:10px 16px;font-weight:800;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.odds span{flex:1;min-width:70px;border-radius:10px;padding:6px 6px;text-align:center;font-size:11px;font-weight:800;background:#ffffff0a;border-bottom:3px solid var(--rc)}
.odds span b{display:block;font-size:13px;color:#fff}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff10}
.li:last-child{border:0}
.li .ic{font-size:24px;width:34px;text-align:center}
.li .tx{flex:1;font-size:13.5px;font-weight:700}
.li .tx small{display:block;color:var(--mu);font-weight:500;font-size:11.5px;margin-top:2px}
.vs{display:grid;grid-template-columns:1fr 40px 1fr;gap:6px;align-items:center;margin:8px 0}
.vs .x{text-align:center;font-weight:900;color:var(--gold);font-size:18px}
.vs .pc svg{height:110px}
.st{display:grid;grid-template-columns:1fr 96px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:12px;color:var(--mu);text-align:center}
.st .b{height:10px;border-radius:99px;background:#ffffff12;overflow:hidden;position:relative}
.st .b i{position:absolute;top:0;bottom:0;border-radius:99px;transition:width .6s}
.st .l i{right:0;background:linear-gradient(270deg,var(--ac),var(--ac2))}
.st .r i{left:0;background:linear-gradient(90deg,#ff8a4d,var(--bad))}
.st .win i{filter:brightness(1.5) drop-shadow(0 0 6px #fff)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 12px}
.slot{aspect-ratio:3/4;border-radius:14px;border:2px dashed #ffffff26;background:#ffffff08;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:24px;overflow:hidden}
.slot svg{height:88%;width:auto}
.conf{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.conf i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cat{margin-bottom:20px}.ch{display:flex;gap:10px;align-items:center;margin:6px 2px 10px}.ch span{font-size:28px}.ch b{font-size:18px}.ch small{display:block;color:var(--mu);font-size:12px;margin-top:1px}.crow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.crow{grid-template-columns:repeat(5,1fr)}}
@media(min-width:760px){.cases{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}.pc svg{height:118px}#mdb{border-radius:26px;margin-bottom:5vh}#md{align-items:center}}
.pimg{height:96px;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px;background:#f2f3f7;border-radius:12px;padding:3px}.ri .pimg{height:104px}.big .pimg{height:230px;margin:6px auto 4px;filter:drop-shadow(0 12px 22px var(--rc))}.vs .pc .pimg{height:110px}.slot .pimg{height:88%}.pc.lock .pimg{filter:grayscale(1) brightness(.35)}
</style></head><body>

/* ---------- батл ---------- */
const stOf=p=>{const u=Math.min(p.usd,1800);return{perf:Math.min(100,8+(p.y-2000)*1.6+p.ram*2.2+u/90),cam:p.mp?Math.min(100,12+p.mp*.32+u/110):6,bat:Math.min(100,p.mah/60),disp:Math.min(100,20+p['in']*5.5+u/100)}};
const ST_N={perf:'⚙️ Мощность',cam:'📷 Камера',bat:'🔋 Батарея',disp:'🖥 Экран'};
function energy(){const now=Date.now();if(S.en>=5){S.enAt=now;return}while(S.en<5&&now-S.enAt>=180000){S.en++;S.enAt+=180000}if(S.en>=5)S.enAt=now}
function bestItem(){return S.items.slice().sort((a,b)=>itemVal(b)-itemVal(a))[0]}
function fighter(){let f=S.fi&&byU(S.fi);if(!f){f=bestItem();S.fi=f?f.u:0}return f}
let bres=null;
function renderBat(){
  energy();const f=fighter();
  let h=`<h2>Батл</h2><div class="sub">Сразись с телефоном соперника: сравниваются мощность, камера, батарея и экран. За победу — монеты и трофеи. Бой стоит 1 ⚡, энергия восстанавливается медленно, а награда небольшая.</div>`;
  h+=`<div class="panel row" style="text-align:center"><div><div class="sub" style="margin:0">Трофеи</div><b style="font-size:20px">🏆 ${S.tr}</b></div><div><div class="sub" style="margin:0">Энергия</div><b style="font-size:20px">⚡ ${S.en}/5</b><div class="sub" style="margin:2px 0 0" data-tm="en">${S.en<5?'+1 через '+tm(180000-(Date.now()-S.enAt)):'полная'}</div></div><div><div class="sub" style="margin:0">Победы</div><b style="font-size:20px">${S.stats.win}/${S.stats.bat}</b></div></div>`;
  if(!f){h+=`<div class="panel sub" style="text-align:center">У тебя нет телефонов. Открой кейс, чтобы выйти на бой!</div>`;$('s-bat').innerHTML=h;return}
  const fp=PH[f.i];
  if(bres){
    const o=bres.opp,so=bres.so,sm=bres.sm;
    h+=`<div class="vs">${pcard(fp,{val:itemVal(f)})}<div class="x">VS</div>${pcard(o)}</div>`;
    ['perf','cam','bat','disp'].forEach((k,i)=>{const a=sm[k],b=so[k],w=a>b;h+=`<div class="st"><div class="b l ${w?'win':''}"><i style="width:${a}%"></i></div><div>${ST_N[k]}<br><b style="color:#fff">${Math.round(a)} : ${Math.round(b)}</b></div><div class="b r ${!w?'win':''}"><i style="width:${b}%"></i></div></div>`});
    h+=`<div class="panel" style="text-align:center;margin-top:12px"><div style="font-size:22px;font-weight:900;color:${bres.win?'var(--ok)':'var(--bad)'}">${bres.win?'Победа! 🎉':'Поражение'}</div><div class="sub" style="margin:6px 0 0">Раунды ${bres.score[0]}:${bres.score[1]} · ${bres.win?`+${money(bres.coins)} · +${bres.tr} 🏆`:`−${bres.tr} 🏆`}</div></div>`;
  }else{
    h+=`<div class="panel"><div class="sub" style="margin:0 0 8px">Твой боец</div><div style="max-width:170px;margin:0 auto">${pcard(fp,{val:itemVal(f),cond:CONDS[f.c][0]})}</div></div>`;
  }
  h+=`<div class="row"><button class="btn g" data-act="pickf">Сменить бойца</button><button class="btn ${S.en>0?'red':'dis'}" data-act="fight">${bres?'Ещё бой':'В бой!'} · 1 ⚡</button></div>`;
  $('s-bat').innerHTML=h;
}
function fight(){
  energy();const f=fighter();if(!f||S.en<1||busy){if(S.en<1)toast('Нет энергии — подожди немного');return}
  const fp=PH[f.i];busy=true;S.en--;if(S.en===4)S.enAt=Date.now();S.stats.bat++;qAdd('bat');
  const pool=PH.filter(p=>Math.abs(p.r-fp.r)<=1&&p!==fp),opp=pick(pool.length?pool:PH);
  const a=stOf(fp),b=stOf(opp),sm={},so={};let sc=[0,0],ta=0,tb=0;
  ['perf','cam','bat','disp'].forEach(k=>{sm[k]=Math.min(100,a[k]*(.85+Math.random()*.3));so[k]=Math.min(100,b[k]*(.85+Math.random()*.3));ta+=sm[k];tb+=so[k];sm[k]>so[k]?sc[0]++:sc[1]++});
  const win=sc[0]>sc[1]||(sc[0]===sc[1]&&ta>=tb);
  const coins=win?Math.min(4000,Math.round(opp.v*.02+80)):0,tr=win?12+(opp.r>=fp.r?4:0):Math.min(S.tr,8);
  bres=null;renderBat();sfx.click();
  // анимация по раундам
  let h=`<div class="vs">${pcard(fp,{val:itemVal(f)})}<div class="x">VS</div>${pcard(opp)}</div><div id="rounds"></div>`;
  $('s-bat').innerHTML=`<h2>Батл</h2>`+h;
  const keys=['perf','cam','bat','disp'];let k=0;
  const step=()=>{
    if(k>=4){
      if(win){S.coins+=coins;S.tr+=tr;S.stats.win++;qAdd('win')}else S.tr-=tr;
      addXp(win?15:5);save();busy=false;bres={opp,sm,so,win,score:sc,coins,tr};renderHead();sfx.rev(win?3:0);hap(win?'success':'error');if(win)confetti(60,'#3ddc84');renderBat();return;
    }
    const key=keys[k],w=sm[key]>so[key];
    $('rounds').insertAdjacentHTML('beforeend',`<div class="st"><div class="b l ${w?'win':''}"><i style="width:${sm[key]}%"></i></div><div>${ST_N[key]}<br><b style="color:#fff">${Math.round(sm[key])} : ${Math.round(so[key])}</b></div><div class="b r ${!w?'win':''}"><i style="width:${so[key]}%"></i></div></div>`);
    sfx.tick();k++;setTimeout(step,850);
  };
  setTimeout(step,500);
}

/* ---------- контракт ---------- */
const CON_P=[.85,.65,.5,.35,.2,.06];
function renderCon(){
  const items=cSel.map(byU).filter(Boolean);cSel=items.map(x=>x.u);
  const r=items.length?PH[items[0].i].r:-1;
  let h=`<h2>Контракт</h2><div class="sub">Отдай 5 телефонов одной редкости и получи 1 телефон редкостью выше. Шансы низкие и падают с редкостью — при неудаче выпадет телефон той же редкости, а отданные пропадают.</div><div class="slots">`;
  for(let k=0;k<5;k++)h+=`<div class="slot" data-act="pickc">${items[k]?psvg(PH[items[k].i]):'+'}</div>`;
  h+=`</div>`;
  if(r>=0&&r<6){const v=items.reduce((a,x)=>a+itemVal(x),0);h+=`<div class="panel" style="text-align:center"><div class="sub" style="margin:0">Редкость <b style="color:${RC[r]}">${RN[r]}</b> → <b style="color:${RC[r+1]}">${RN[r+1]}</b></div><div style="font-size:22px;font-weight:900;margin:6px 0">Шанс ${Math.round(CON_P[r]*100)}%</div><div class="sub" style="margin:0">Стоимость отдаваемых: ${money(v)}</div></div>`}
  else if(r===6)h+=`<div class="panel sub" style="text-align:center">Божественные телефоны нельзя обменять.</div>`;
  h+=`<div class="row"><button class="btn g" data-act="pickc">Выбрать (${items.length}/5)</button><button class="btn ${items.length===5&&r<6?'':'dis'}" data-act="contract">Заключить</button></div>`;
  $('s-con').innerHTML=h;
}
function pickerHTML(){
  const items=cSel.map(byU).filter(Boolean),r=items.length?PH[items[0].i].r:-1;
  const list=S.items.filter(x=>PH[x.i].r<6&&(r<0||PH[x.i].r===r)).sort((a,b)=>PH[b.i].r-PH[a.i].r||itemVal(b)-itemVal(a)).slice(0,200);
  return `<h2 style="text-align:center">Выбери 5 телефонов${r>=0?' · '+RN[r]:''}</h2>${list.length?`<div class="grid" style="margin-bottom:12px">${list.map(x=>icard(x,{sel:cSel.includes(x.u),attr:`data-cu="${x.u}"`})).join('')}</div>`:'<div class="sub" style="text-align:center">Подходящих телефонов нет.</div>'}<button class="btn w" data-act="close">Готово (${cSel.length}/5)</button>`;
}
function doContract(){
  const items=cSel.map(byU).filter(Boolean);if(items.length!==5)return;
  const r=PH[items[0].i].r;if(r>=6)return;
  const ok=Math.random()<CON_P[r],nr=ok?r+1:r;
  sellItemsNoCoins(items);
  const ph=pick(PH.filter(p=>p.r===nr)),it=addItem({i:ph.i,c:wpick(CONDS.map((x,i)=>i),i=>CONDS[i][2]),s:Math.random()<SHINY?1:0});
  S.stats.con++;qAdd('con');addXp(20);cSel=[];save();renderAll();
  toast(ok?'Контракт успешен! Редкость повышена':'Не повезло: редкость та же');
  reveal(it,false);
}
function sellItemsNoCoins(list){const set=new Set(list.map(x=>x.u));S.items=S.items.filter(x=>!set.has(x.u));if(S.fi&&!byU(S.fi))S.fi=0}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-case],[data-tab],[data-fr],[data-act],[data-u],[data-cat],[data-cu]');if(!t)return;
  const d=t.dataset;

  if(d.act){
    sfx.click();
    switch(d.act){
      case 'close':closeModal();renderAll();break;
      case 'open1':open1();break;
      case 'open5':open5();break;
      case 'skip':skipFn&&skipFn();break;
      case 'sell1':{const it=byU(+d.u);if(it){const v=sellItems([it]);save();sfx.coin();hap('success');closeModal();toast('+'+money(v));renderAll()}break}
      case 'sellmany':{const l=(d.us||'').split(',').filter(Boolean).map(u=>byU(+u)).filter(Boolean);if(l.length){const v=sellItems(l);save();sfx.coin();hap('success');closeModal();toast('+'+money(v))}renderAll();break}
      case 'fighter':S.fi=+d.u;bres=null;save();closeModal();go('bat');break;
      case 'pickf':{const l=S.items.slice().sort((a,b)=>itemVal(b)-itemVal(a)).slice(0,60);openModal(`<h2 style="text-align:center">Выбери бойца</h2><div class="grid">${l.map(x=>icard(x,{attr:`data-u="${x.u}" data-act="fighter"`})).join('')}</div>`);break}
      case 'fight':fight();break;
      case 'pickc':openModal(pickerHTML());break;
      case 'contract':doContract();break;
      case 'more':colPage++;renderCol();break;
      case 'selldup':{
        const m={};S.items.forEach(x=>{(m[x.i]=m[x.i]||[]).push(x)});
        const sell=[];Object.values(m).forEach(a=>{if(a.length>1){a.sort((p,q)=>itemVal(q)-itemVal(p));sell.push(...a.slice(1).filter(x=>!x.s))}});

      case 'selllow':{
        const sell=S.items.filter(x=>PH[x.i].r<=0&&!x.s);
        if(!sell.length){toast('Обычных телефонов нет');break}
        openModal(`<h2 style="text-align:center">Продать обычные?</h2><div class="sub" style="text-align:center">Будет продано: <b>${sell.length}</b> шт. за <b style="color:var(--gold)">${money(sell.reduce((a,x)=>a+sellPrice(x),0))}</b><br>★ лимитки не продаются автоматически.</div><div class="row"><button class="btn g" data-act="close">Отмена</button><button class="btn" data-act="sellmany" data-us="${sell.map(x=>x.u).join(',')}">Продать</button></div>`);break}
      case 'brand':{const a=PH.filter(p=>p.b===d.b);if(a.every(p=>S.seen[p.i])&&!S.br[d.b]){const r=Math.round(a.reduce((s,p)=>s+p.v,0)*.15);S.br[d.b]=1;S.coins+=r;save();sfx.coin();hap('success');toast(`Коллекция ${d.b} собрана! +${fmt(r)} ${CU}`);renderAll()}break}
      case 'daily':{const today=dayNum();if(S.dl.day===today)break;const streak=S.dl.day===today-1?S.dl.streak+1:1,r=DAILY[(streak-1)%7];S.dl={day:today,streak};S.coins+=r;save();sfx.coin();hap('success');toast('+'+money(r));renderAll();break}
      case 'free':openFree();break;
      case 'rewiki':WIMG={};try{localStorage.removeItem('pb_wimg')}catch(e){}WST='фото: запрос…';loadWiki().then(renderAll);renderAll();break;

      case 'ach':{const a=ACH.find(x=>x[0]===d.a);if(a&&!S.ach[a[0]]&&a[4]()>=a[5]){S.ach[a[0]]=1;S.coins+=a[6];save();sfx.coin();hap('success');toast('+'+money(a[6]));renderAll()}break}
    }
    return;
  }
  if(d.go){go(d.go);return}
  if(d.case){sfx.click();if(d.case==='free')openFree();else{caseId=d.case;go('case')}return}
  if(d.tab){colTab=d.tab;colPage=1;renderCol();return}

  if(d.cat!==undefined){const p=PH[+d.cat];if(!S.seen[p.i]&&cur==='col'){toast(`Ещё не получен · ${RN[p.r]} · ${fmt(p.v)} ${CU}`);return}itemModal({i:p.i,c:2,s:0,u:-1},'info');return}
  if(d.u!==undefined){const it=byU(+d.u);if(it){sfx.click();itemModal(it,'view')}return}
});
document.addEventListener('change',e=>{if(e.target.id==='fb'){fB=e.target.value;colPage=1;renderCol()}if(e.target.id==='fs'){fS=e.target.value;colPage=1;renderCol()}});
$('snd').addEventListener('click',()=>{S.snd=S.snd?0:1;save();renderHead();if(S.snd)sfx.click()});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- таймеры ---------- */
setInterval(()=>{
  const fr=freeLeft();
  document.querySelectorAll('[data-tm="free"]').forEach(e=>e.textContent=fr>0?'Через '+tm(fr):'Готов к открытию!');
  document.querySelectorAll('[data-tm="freeb"]').forEach(e=>{if(fr>0)e.textContent=tm(fr);else if(e.classList.contains('dis'))renderBon()});
  const f=$('frb');if(f)f.textContent=fr>0?'⏳ Ждём':'Открыть';
  if(cur==='bat'&&!busy){const en=S.en;energy();if(S.en!==en)renderBat();else document.querySelectorAll('[data-tm="en"]').forEach(e=>e.textContent=S.en<5?'+1 через '+tm(180000-(Date.now()-S.enAt)):'полная')}
  $('bdot').classList.toggle('on',bonusDot());
},1000);
renderAll();cloudLoad();
setTimeout(loadWiki,1200);
</script>
